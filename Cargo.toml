[package]
name = "sunshine-manager"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/sunshine-manager"
description = "Independent Sunshine manager with local authentication"
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
sarmg-admin-auth = { version = "=0.4.0", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "0e1be10273fd6abf72e0d0eeb24cbb1120572486" }
sarmg-admin-axum = { version = "=0.4.0", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "0e1be10273fd6abf72e0d0eeb24cbb1120572486" }
sarmg-admin-core = { version = "=0.4.0", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "0e1be10273fd6abf72e0d0eeb24cbb1120572486" }
sarmg-admin-sqlite = { version = "=0.4.0", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "0e1be10273fd6abf72e0d0eeb24cbb1120572486" }
sarmg-contracts = { version = "=0.4.0", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "0e1be10273fd6abf72e0d0eeb24cbb1120572486" }
sarmg-error = { version = "=0.4.0", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "0e1be10273fd6abf72e0d0eeb24cbb1120572486" }
sarmg-platform-db = { version = "=0.4.0", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "0e1be10273fd6abf72e0d0eeb24cbb1120572486" }
sarmg-schema-identity = { version = "=0.4.0", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "0e1be10273fd6abf72e0d0eeb24cbb1120572486" }
sarmg-server-target = { version = "=0.4.0", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "0e1be10273fd6abf72e0d0eeb24cbb1120572486" }
sarmg-sqlite = { version = "=0.4.0", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "0e1be10273fd6abf72e0d0eeb24cbb1120572486" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "derive",
  "json",
  "macros",
  "sqlite",
  "runtime-tokio",
  "uuid",
] }
subtle = "=2.6.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
