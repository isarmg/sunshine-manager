[package]
name = "unionc-sunshine-worker"
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/sunshine-worker"
description = "Private Sunshine process module compiled and supervised by UnionC"
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hmac = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "derive",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring",
  "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
sarmg-platform-core = { git = "https://github.com/isarmg/sarmg-platform.git", rev = "e7332a13d8ad5a08c7d7115a58a0fa47582c0bef" }
sarmg-platform-gateway = { git = "https://github.com/isarmg/sarmg-platform.git", rev = "e7332a13d8ad5a08c7d7115a58a0fa47582c0bef" }
sarmg-platform-sdk = { git = "https://github.com/isarmg/sarmg-platform.git", rev = "e7332a13d8ad5a08c7d7115a58a0fa47582c0bef" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
