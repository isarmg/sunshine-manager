name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  source:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: python3 scripts/check-workflow-supply-chain.py
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust and manifest contract
        run: cargo test --locked
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build the standalone frontend
        working-directory: web
        run: npm run build
