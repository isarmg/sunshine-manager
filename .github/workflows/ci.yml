name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  agent-windows-core:
    permissions:
      contents: read
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      VSLANG: 1033
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: python scripts/check-workflow-supply-chain.py
      - name: Install exact Agent Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Validate native Windows Agent core (not Server or installation acceptance)
        shell: pwsh
        run: |
          cargo test --locked -p sunshine-agent -p sunshine-agent-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p sunshine-agent -p sunshine-agent-protocol --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Verify native Windows HTTPS and WSS boundaries
        shell: pwsh
        run: |
          $agentOpenSsl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          if (-not (Test-Path -LiteralPath $agentOpenSsl)) { throw 'OpenSSL is required for Agent TLS acceptance' }
          $env:PATH = (Split-Path $agentOpenSsl) + ';' + $env:PATH
          cargo test --locked -p sunshine-agent --test local_https -- --ignored
          exit $LASTEXITCODE
  source:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: python3 scripts/check-workflow-supply-chain.py
      - name: Validate release tooling
        run: |
          python3 -m py_compile scripts/package-release.py scripts/write-release-manifest.py
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Enforce the Linux AMD64 Server target boundary
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          gate_binary="${RUNNER_TEMP}/sunshine-manager-build-gate"
          gate_stderr="${RUNNER_TEMP}/sunshine-manager-build-gate.stderr"
          rustc build.rs -o "$gate_binary"
          if TARGET=aarch64-unknown-linux-gnu "$gate_binary" 2>"$gate_stderr"; then
            echo 'Server build gate accepted an unsupported target.' >&2
            exit 1
          fi
          grep -F \
            'Sunshine Manager server supports only x86_64-unknown-linux-gnu' \
            "$gate_stderr"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the Server target
        run: cargo check --locked --target x86_64-unknown-linux-gnu --all-targets
      - name: Lint the Server target
        run: cargo clippy --locked --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - name: Test Rust and manifest contract
        run: cargo test --locked --target x86_64-unknown-linux-gnu
      - name: Test and lint product-owned Agent protocol and execution core
        run: |
          cargo test --locked -p sunshine-agent -p sunshine-agent-protocol
          cargo clippy --locked -p sunshine-agent -p sunshine-agent-protocol --all-targets -- -D warnings
      - name: Verify Agent local HTTPS certificate and configuration boundaries
        run: cargo test --locked -p sunshine-agent --test local_https -- --ignored
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: clients/web
        run: npm ci
      - name: Build the standalone frontend
        working-directory: clients/web
        run: npm run build
      - name: Install browser acceptance engines
        working-directory: clients/web
        run: npx playwright install --with-deps chromium firefox
      - name: Verify instance and remote management UI
        working-directory: clients/web
        run: npm run test:browser
