# Include in the trusted HTTPS server{} alongside the existing admin location.
# Supply a verified full certificate chain and private key in that server block.
# Manager MUST bind only to loopback. Untrusted clients cannot supply forwarding assertions.
location /sunshine-agent/v1/ {
    proxy_pass http://127.0.0.1:18104;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    client_max_body_size 16k;
    # Do not log Authorization, request bodies, tickets or cookies.
    access_log off;
}
