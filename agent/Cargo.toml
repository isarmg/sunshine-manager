[package]
name = "sunshine-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
sarmg-agent-secure-http = { git = "https://github.com/isarmg/sarmg-foundation-agent.git", rev = "a5b3158aa62af8189dd909500758cee649898e5c", version = "=0.6.0" }
sarmg-agent-runtime = { git = "https://github.com/isarmg/sarmg-foundation-agent.git", rev = "a5b3158aa62af8189dd909500758cee649898e5c", version = "=0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sunshine-agent-protocol = { path = "../protocol", version = "=0.1.0" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
sarmg-agent-fs-safety = { git = "https://github.com/isarmg/sarmg-foundation-agent.git", rev = "a5b3158aa62af8189dd909500758cee649898e5c", version = "=0.6.0" }

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
windows-service = "=0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
